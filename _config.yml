# SITE CONFIGURATION
title: DAWN # your site title
author: DAWN # You :P
description: > # Meta description of Homepage
  Discovery of Astronomy and Wonders of the Night
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://ajou-dawn.com" # the base hostname & protocol for your site, e.g. http://example.com

# SEO PLUGIN
social:
  name: DAWN
  links:
    - https://twitter.com/
    - https://www.facebook.com/
    - https://www.linkedin.com/in/
    - https://plus.google.com/
    - https://github.com/
    - https://keybase.io/

# THEME SETTINGS
navigation: # Navigation links
  - {name: '홈', link: '/'}
  - {name: '소개', link: '/about'}
  - {name: '위키 (preparing...)', link: 'https://ajou-dawn.com/wiki'}
  - {name: '문의', link: '/contact'}

tagline: >
  Discovery of Astronomy and Wonders of the Night

hero_img: posts/dawn-banner.jpg # Main background image: use the path from /assets/img/ => This will output /assets/img/posts/sleek_lg.jpg

email: stud_dawn@ajou.ac.kr # email for form submission

twitter_username: # replace with your_twitter_username or comment to remove link from footer
github_username: esmnce  # replace with your_github_username or comment to remove link from footer
instagram_username:  # replace with your_instagram_username or comment to remove link from footer

disqus:
  shortname:  # to enable comments replace with your_disqus_shortname

# google_tag_manager: GTM-XXXXXXX # Uncomment to enable GTM. Replace GTM-XXXXXXX with your GTM container ID

service_worker: true

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge # or pygments or null
# theme: jekyll-sleek # Uncomment if you're using the theme as a ruby gem
exclude:
  - README.md
  - node_modules
  - script
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - npm-debug.log
  - gulpfile.js
  - sleek.jpg

include: ['_pages']
permalink: /:title/

compress_html:
  clippings: all

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 12
paginate_path: /page:num/
