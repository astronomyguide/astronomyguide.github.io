{% comment %}
<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__left">
      <a href="https://www.ajou.ac.kr/kr/index.do"><img src="/assets/img/au.svg" alt="Ajou University logo" class="footer__logo"></a>
    </div>

    <div class="footer__center">
      <span class="footer__copy">
        Copyright &copy; {{ site.time | date: '%Y' }} {{ site.title | escape }}. All rights reserved.
      </span>
    </div>

    <div class="footer__right">
      <a href="https://physics.ajou.ac.kr/physics/index.do" style="color: black;"><span class="footer__address" style="font-size: 9px; font-family: 'Ajou';">
        Department of Physics
      </span></a>
    </div>
  </div>
</footer>
<script async src="{{ "/assets/js/bundle.js" | relative_url }}"></script>
{% if site.service_worker %}
<script async>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}')
      .then(reg => console.log('ServiceWorker registration successful with scope: ', reg.scope))
      .catch(err => console.log('ServiceWorker registration failed: ', err));
  }
</script>
{% endif %}
{% endcomment %}
